
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de sesion - Campus Virtual</title>

    <!-- Bootstrap y Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="./css/estilos.css">
</head>

<body class="pagina-login">

    <!-- Encabezado/Titulo principal -->
    <header>
        <div class="container">
            <h1 id="titulo">Campus Virtual Universitario</h1>
            <p>Tu espacio de aprendizaje academico</p>
        </div>
    </header>

    <main>

        <section id="inicio">

            <div class="container">

                    <!-- Formulario de inicio de sesion -->
                    <div class="row align-items-centercol-md-6">

                        <div class="card tarjeta-login">

                            <div class="card-body">

                                <h3 class="card-title text-center">
                                    Inicio de sesion
                                </h3>

                                <p class="texto-login text-center">
                                    Ingresa tus credenciales para continuar.
                                </p>

                                <form id="formLogin">

                                    <div class="mb-3">

                                        <label for="correoLogin" class="form-label">
                                            Correo electronico
                                        </label>

                                        <div class="input-group">
                                            <span class="input-group-text">
                                                <i class="bi bi-envelope"></i>
                                            </span>

                                            <input type="email" class="form-control" id="correoLogin" name="correoLogin"
                                                placeholder="correo@universidad.com" autocomplete="username" required>
                                        </div>

                                    </div>

                                    <div class="mb-3">

                                        <label for="passwordLogin" class="form-label">
                                            Contrasena
                                        </label>

                                        <div class="input-group">

                                            <span class="input-group-text">
                                                <i class="bi bi-lock"></i>
                                            </span>

                                            <input type="password" class="form-control" id="passwordLogin"
                                                name="passwordLogin" placeholder="Ingresa tu contrasena"
                                                autocomplete="current-password" required>

                                            <button type="button" class="btn btn-outline-secondary"
                                                id="btnMostrarPassword" aria-label="Mostrar contrasena">
                                                <i class="bi bi-eye"></i>
                                            </button>

                                        </div>

                                    </div>

                                    <!-- Mensajes del formulario -->
                                    <div id="mensajeLogin" class="alert d-none" role="alert" aria-live="polite">
                                    </div>

                                    <button type="submit" class="btn btn-primary w-100" id="btnIniciarSesion">

                                        <i class="bi bi-box-arrow-in-right"></i>
                                        Iniciar sesion

                                    </button>

                                </form>

                                <div class="separador-login"></div>

                                <p class="texto-seguridad text-center">
                                    Acceso para estudiantes, docentes y administradores.
                                </p>

                                <div class="text-center mt-3">
                                    <a href="index.html" class="enlace-regreso">
                                        Volver al inicio
                                    </a>
                                </div>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </section>

    </main>

    <!-- Footer -->
    <footer>
        <p>Campus Virtual Universitario - 2026</p>
        <p>San Jose, Costa Rica</p>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JavaScript -->
    <script src="./js/script.js"></script>

</body>

</html>
